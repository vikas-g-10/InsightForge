  fraud_financial:
    - tier: high
      suggested_action: "escalate to QA and Compliance within 24 hours"
      terms: [scam, scammer*, fraud*, "unauthorized transaction*", "unauthorised transaction*",
        "stole my money", "money stolen", dhokha, dhokhebaaz, thagi, धोखा, ठगी, फ्रॉड]
