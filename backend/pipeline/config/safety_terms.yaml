# Safety terms reconciled with PRD v4 Section 7.2.
# Tiers: critical | high | medium.
# Critical: fire, explosion, sparks, shock, burn, smoke.
# High: allergic reaction, rash, choking, bleeding, injury, fainting.
# Medium: overheating, swelling battery, leakage.
# Suggested action: "escalate to QA and Compliance within 24 hours".
# A trailing * allows any letter suffix (min 4 chars before *).

categories:
  physical_safety:
    - tier: critical
      suggested_action: "escalate to QA and Compliance within 24 hours"
      terms:
        # Fire
        - "caught fire"
        - "catch fire"
        - "caught on fire"
        - "on fire"
        - "phone caught fire"
        - "burst into flames"
        - "fire hazard"
        - "aag lag*"
        - "aag lagi"
        - "आग लग*"
        - "आग लगी"
        # Explosion
        - explod*
        - explosion
        - blast*
        - blast
        # Sparks
        - spark*
        - sparks
        - sparking
        - "sparks flying"
        # Shock
        - "electric shock"
        - electrocut*
        - "short circuit"
        - "current laga"
        - "करंट लगा"
        # Burn
        - "burned my"
        - "burnt my"
        - "burns my"
        - "chemical burn"
        - "severe burn"
        - burn*
        - "jal gaya"
        - "जल गया"
        # Smoke
