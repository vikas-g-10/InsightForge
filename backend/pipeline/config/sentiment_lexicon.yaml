# PROPOSED DEFAULT LEXICON (the PRD's Hindi/Hinglish term list was not available).
# Weights are integers from -3 to 3 (0 = neutral). Terms are lowercase.
#   - A trailing * allows any suffix (love* -> loved, lovely). Min 4 chars before *.
#   - Multi-word phrases are matched as token sequences, longest first.
#   - Quote words YAML reads as booleans (no, on, yes).
# negators_before: negation words that flip a term when they appear up to 3
#   tokens BEFORE it (English: "not good"). Words ending in n't also count.
# negators_after: negation words up to 2 tokens AFTER it (Hindi: "accha nahi").
# A negated term flips sign and is halved (-0.5 x weight): "not good" is
# mildly negative, "not bad" is mildly positive.
negators_before: ["not", "no", never, cannot, without, neither, nor, hardly, barely]
negators_after: [nahi, nahin, nhi, नहीं, नही, illa, ledu, alla, illai, baledu]
